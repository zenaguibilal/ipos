<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">
  <defs>
    <!-- تدرج الخلفية -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2410c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <!-- تدرج الأيقونة -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed7aa;stop-opacity:1" />
    </linearGradient>
    <!-- ظل -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12"
                    flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- خلفية مربعة بحواف دائرية -->
  <rect width="512" height="512" rx="96" ry="96"
        fill="url(#bgGrad)"/>

  <!-- طبقة زجاجية فوق الخلفية -->
  <rect width="512" height="512" rx="96" ry="96"
        fill="rgba(255,255,255,0.08)"/>

  <!-- سلة التسوق — الجسم الرئيسي -->
  <g filter="url(#shadow)" fill="url(#iconGrad)">

    <!-- مقبض السلة -->
    <path d="M 156 140
             C 156 110, 180 88, 210 88
             L 302 88
             C 332 88, 356 110, 356 140
             L 356 175
             L 310 175
             L 310 148
             C 310 138, 302 130, 292 130
             L 220 130
             C 210 130, 202 138, 202 148
             L 202 175
             L 156 175
             Z"
          opacity="0.9"/>

    <!-- جسم السلة -->
    <rect x="128" y="175" width="256" height="180"
          rx="16" ry="16"/>

    <!-- شاشة الكاشير داخل السلة -->
    <rect x="168" y="205" width="176" height="110"
          rx="10" ry="10"
          fill="#ea580c"/>

    <!-- شاشة الكاشير - محتوى -->
    <rect x="178" y="215" width="156" height="80"
          rx="6" ry="6"
          fill="#1a0a00"
          opacity="0.8"/>

    <!-- رمز الدولار على الشاشة -->
    <text x="256" y="268"
          font-family="Arial, sans-serif"
          font-size="52"
          font-weight="bold"
          fill="#f97316"
          text-anchor="middle"
          dominant-baseline="middle">$</text>

    <!-- خط تحت الشاشة -->
    <rect x="168" y="320" width="176" height="8"
          rx="4" ry="4"
          fill="rgba(255,255,255,0.3)"/>

    <!-- عجلات السلة -->
    <circle cx="196" cy="388" r="22" fill="url(#iconGrad)"/>
    <circle cx="316" cy="388" r="22" fill="url(#iconGrad)"/>

    <!-- مراكز العجلات -->
    <circle cx="196" cy="388" r="10" fill="#ea580c"/>
    <circle cx="316" cy="388" r="10" fill="#ea580c"/>

  </g>

  <!-- توهج برتقالي في الأسفل -->
  <ellipse cx="256" cy="460" rx="140" ry="20"
           fill="rgba(249,115,22,0.3)"/>

</svg>